<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Property Caption Generator</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:#f2f3f5;color:#111}
main{max-width:720px;margin:auto;padding:16px;padding-bottom:40px}
h1{font-size:25px;margin:4px 0 16px;text-align:center}.card{background:white;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
h2{font-size:18px;margin:0 0 10px}
label{display:block;font-size:14px;font-weight:700;margin:12px 0 6px}
input{width:100%;font-size:16px;padding:12px;border:1px solid #d7d7d7;border-radius:10px;background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.point{display:flex;gap:7px;margin:8px 0}.point input{min-width:0}.remove{width:44px;background:#eee;border:0;border-radius:10px;font-size:20px}
#detailsPoints{margin-top:14px}
#addDetailBtn{margin-top:4px;margin-bottom:14px}
button{border:0;border-radius:11px;padding:12px 15px;font-size:16px;font-weight:700}
.add{background:#eee}.generate{width:100%;background:#111;color:#fff;margin-top:14px}.reset{width:100%;background:#f3d7d7;color:#9b1c1c;margin-top:10px}.copy{width:100%;background:#d9f2df;color:#176b2c;margin-top:10px}
.templateBtn{width:100%;background:#eee;color:#333;margin-top:10px}
#shareBtn{width:100%;background:#dbeafe;color:#174ea6;margin-top:10px}
.output{min-height:100px;background:#fafafa;border:1px solid #ddd;border-radius:12px;padding:15px;white-space:pre-wrap;line-height:1.55;font-size:16px}
.ok{color:#167c35;font-size:13px;margin:8px 0 0;display:none;text-align:center}
</style>
</head>
<body>
<main>
<h1>Property Caption Generator</h1>

<section class="card">
<h2>Maklumat Utama</h2>
<label>Jenis Rumah</label><input id="jenis" placeholder="Contoh: Single Storey Semi-D">
<label>Lokasi</label><input id="lokasi" placeholder="Contoh: Bertam, Melaka">
<div class="row">
<div><label>Harga (RM)</label><input id="harga" inputmode="numeric" placeholder="397000"></div>
<div><label>Ansuran (RM)</label><input id="ansuran" inputmode="numeric" placeholder="1400"></div>
</div>
</section>

<section class="card">
<h2>Maklumat Hartanah</h2>
<label>Pegangan</label><input id="pegangan" placeholder="Freehold">
<label>Title</label><input id="title" placeholder="MCL">
<div class="row">
<div><label>Lebar</label><input id="lebar" inputmode="decimal" placeholder="35"></div>
<div><label>Panjang</label><input id="panjan" inputmode="decimal" placeholder="75"></div>
</div>
<label>Built-up Area</label><input id="builtup" placeholder="Contoh: 2500sqft">
<div class="row">
<div><label>Bilik Tidur</label><input id="bilik" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="4"></div>
<div><label>Bilik Air</label><input id="air" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="2"></div>
</div>
<div id="detailsPoints"></div>
<button class="add" type="button" id="addDetailBtn">+ Tambah Point</button>
<label>Jangka Siap</label><input id="siap" placeholder="Q1 2027">
</section>

<section class="card">
<h2>Kelebihan Lokasi</h2>
<div id="points"></div>
<button class="add" type="button" id="addBtn">+ Tambah Point</button>
</section>

<section class="card">
<h2>Hubungi Untuk Maklumat Lanjut</h2>
<label>Nama</label><input id="contactName" placeholder="Nama">
<label>Nombor Telefon</label><input id="contactPhone" type="tel" inputmode="tel" placeholder="01x-xxxxxxx">
<label>Remark Whatsapp</label><input id="contactRemark" placeholder="Contoh: Rumah Semi D Seremban">
<button class="generate" type="button" id="generateBtn">GENERATE</button>
<button class="reset" type="button" id="resetBtn">↻ RESET</button>
</section>

<section class="card">
<h2>Caption Generated</h2>
<div id="output" class="output">Hasil akan muncul di sini.</div>
<button class="templateBtn" type="button" id="templateBtn">🔄 TUKAR TEMPLATE</button>
<button class="copy" type="button" id="copyBtn">📋 COPY CAPTION</button>
<button class="copy" type="button" id="shareBtn">↗️ SHARE</button>
<div id="status" class="ok">✓ Ayat berjaya disalin</div>
</section>
</main>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const points=$("points");
const detailsPoints=$("detailsPoints");

function addDetailPoint(value=""){
  const row=document.createElement("div");
  row.className="point";
  const input=document.createElement("input");
  input.className="detailPointInput";
  input.placeholder="Contoh: Carporch Luas";
  input.value=value;
  const remove=document.createElement("button");
  remove.type="button";
  remove.className="remove";
  remove.textContent="×";
  remove.addEventListener("click",()=>row.remove());
  row.appendChild(input);
  row.appendChild(remove);
  detailsPoints.appendChild(row);
}

function addPoint(value=""){
  const row=document.createElement("div");
  row.className="point";
  const input=document.createElement("input");
  input.className="pointInput";
  input.placeholder="Contoh: 10 minit ke Lotus Cheng";
  input.value=value;
  const remove=document.createElement("button");
  remove.type="button";
  remove.className="remove";
  remove.textContent="×";
  remove.addEventListener("click",()=>row.remove());
  row.appendChild(input);
  row.appendChild(remove);
  points.appendChild(row);
}

function val(id){return $(id).value.trim()}

function formatNumberInput(input){
  var digits = input.value.replace(/\D/g, "");
  if (digits.length === 0) {
    input.value = "";
    return;
  }

  var formatted = "";
  for (var i = 0; i < digits.length; i++) {
    if (i > 0 && (digits.length - i) % 3 === 0) {
      formatted += ",";
    }
    formatted += digits[i];
  }
  input.value = formatted;
}

let currentTemplate=0;

function buildData(){
  const p=[...document.querySelectorAll(".pointInput")].map(x=>x.value.trim()).filter(Boolean);
  const dp=[...document.querySelectorAll(".detailPointInput")].map(x=>x.value.trim()).filter(Boolean);
  return {
    jenis:val("jenis"), lokasi:val("lokasi"), harga:val("harga"), ansuran:val("ansuran"),
    pegangan:val("pegangan"), title:val("title"), lebar:val("lebar"), panjan:val("panjan"),
    builtup:val("builtup"), bilik:val("bilik"), air:val("air"), siap:val("siap"),
    detailPoints:dp, points:p, contactName:val("contactName"), contactPhone:val("contactPhone"),
    contactRemark:val("contactRemark")
  };
}

function whatsappUrl(d){
  if(!d.contactPhone) return "";
  const waNumber=d.contactPhone.replace(/\D/g,"").replace(/^0/,"60");
  if(!waNumber) return "";
  return "https://wa.me/"+waNumber+(d.contactRemark ? "?text="+encodeURIComponent(d.contactRemark).replace(/%20/g,"+") : "");
}

function propertySize(d){
  if(d.lebar && d.panjan) return d.lebar+"’ x "+d.panjan+"’";
  if(d.lebar) return d.lebar+"’";
  if(d.panjan) return d.panjan+"’";
  return "";
}

function commonDetails(d, bullet="✅ "){
  const a=[];
  if(d.pegangan) a.push(bullet+"Pegangan: "+d.pegangan);
  if(d.title) a.push(bullet+"Title: "+d.title);
  if(propertySize(d)) a.push(bullet+"Saiz: "+propertySize(d));
  if(d.builtup) a.push(bullet+"Built-up Area: "+d.builtup);
  if(d.bilik || d.air) a.push(bullet+(d.bilik||"—")+" bilik tidur, "+(d.air||"—")+" bilik air");
  d.detailPoints.forEach(x=>a.push(bullet+x));
  if(d.siap) a.push(bullet+"Jangka siap: "+d.siap);
  return a;
}

function contactLines(d, style){
  const a=[];
  if(!(d.contactName || d.contactPhone)) return a;
  if(style===1){
    a.push("HUBUNGI UNTUK MAKLUMAT LANJUT","");
    if(d.contactName) a.push("👤 "+d.contactName);
    if(d.contactPhone) a.push("📞 "+d.contactPhone);
  }else if(style===2){
    a.push("📞 HUBUNGI UNTUK MAKLUMAT LANJUT");
    if(d.contactName) a.push("👤 "+d.contactName);
    if(d.contactPhone) a.push(d.contactPhone);
  }else if(style===3){
    a.push("📲 BERMINAT? HUBUNGI SAYA");
    if(d.contactName) a.push("Nama: "+d.contactName);
    if(d.contactPhone) a.push("Telefon: "+d.contactPhone);
  }else{
    a.push("✨ UNTUK MAKLUMAT LANJUT / VIEWING");
    if(d.contactName) a.push("👤 "+d.contactName);
    if(d.contactPhone) a.push("📞 "+d.contactPhone);
  }
  const wa=whatsappUrl(d);
  if(wa) a.push("💬 "+wa);
  return a;
}

function generate(){
  const d=buildData();
  const lines=[];

  // Template 1 — ASAL: kekalkan susunan asal sepenuhnya.
  if(currentTemplate===0){
    if(d.jenis) lines.push("🏡 "+d.jenis);
    if(d.lokasi) lines.push("📍 "+d.lokasi);
    lines.push("");
    if(d.harga) lines.push("💰 Harga bermula dari RM"+d.harga);
    if(d.ansuran) lines.push("💵 Anggaran bulanan serendah RM"+d.ansuran);
    lines.push("","MAKLUMAT HARTANAH","");
    lines.push(...commonDetails(d));
    if(d.points.length) lines.push("","KELEBIHAN LOKASI","",...d.points.map(x=>"📌 "+x));
    lines.push("",...contactLines(d,1));
  }

  // Template 2 — harga dahulu, kemudian info hartanah, lokasi di bawah.
  else if(currentTemplate===1){
    if(d.harga) lines.push("💰 HARGA RM"+d.harga);
    if(d.ansuran) lines.push("💵 ANSURAN SERENDAH RM"+d.ansuran);
    if(d.jenis) lines.push("", "🏠 "+d.jenis);
    if(d.lokasi) lines.push("📍 "+d.lokasi);
    lines.push("","DETAIL HARTANAH","",...commonDetails(d,"• "));
    if(d.points.length) lines.push("","📍 LOKASI & KEMUDAHAN","",...d.points.map(x=>"• "+x));
    lines.push("",...contactLines(d,2));
  }

  // Template 3 — gaya iklan ringkas.
  else if(currentTemplate===2){
    if(d.jenis) lines.push("✨ "+d.jenis);
    if(d.lokasi) lines.push("📍 "+d.lokasi);
    if(d.harga) lines.push("","💰 RM"+d.harga);
    if(d.ansuran) lines.push("💳 Ansuran dari RM"+d.ansuran);
    if(d.points.length) lines.push("","⭐ KELEBIHAN LOKASI","",...d.points.map(x=>"✓ "+x));
    lines.push("","🏡 INFO HARTANAH","",...commonDetails(d,"🔹 "));
    lines.push("",...contactLines(d,3));
  }

  // Template 4 — format padat dengan tajuk besar dan lokasi di awal.
  else if(currentTemplate===3){
    if(d.jenis) lines.push("🏡 "+d.jenis.toUpperCase());
    if(d.lokasi) lines.push("📍 "+d.lokasi);
    lines.push("");
    lines.push("HARGA & ANSURAN");
    if(d.harga) lines.push("RM"+d.harga);
    if(d.ansuran) lines.push("Serendah RM"+d.ansuran+" / bulan");
    lines.push("","SPESIFIKASI","",...commonDetails(d,"▪ "));
    if(d.points.length) lines.push("","KELEBIHAN LOKASI","",...d.points.map(x=>"📌 "+x));
    lines.push("",...contactLines(d,4));
  }

  // Template 5 — susunan lokasi dahulu, harga di tengah.
  else if(currentTemplate===4){
    if(d.lokasi) lines.push("📍 "+d.lokasi);
    if(d.jenis) lines.push("🏘️ "+d.jenis);
    lines.push("","KENAPA PILIH HARTANAH INI?");
    if(d.points.length) lines.push(...d.points.map(x=>"✓ "+x));
    lines.push("","💰 HARGA HARTANAH");
    if(d.harga) lines.push("RM"+d.harga);
    if(d.ansuran) lines.push("💵 Ansuran bulanan: RM"+d.ansuran);
    lines.push("","MAKLUMAT HARTANAH","",...commonDetails(d,"• "));
    lines.push("",...contactLines(d,1));
  }

  // Template 6 — gaya checklist.
  else if(currentTemplate===5){
    if(d.jenis) lines.push("🏡 "+d.jenis);
    if(d.harga) lines.push("💰 RM"+d.harga);
    if(d.lokasi) lines.push("📍 "+d.lokasi);
    lines.push("","CHECKLIST HARTANAH");
    lines.push(...commonDetails(d,"☑ "));
    if(d.points.length) lines.push("","APA YANG ADA DI SEKITAR?","",...d.points.map(x=>"📌 "+x));
    if(d.ansuran) lines.push("","💵 Ansuran bulanan serendah RM"+d.ansuran);
    lines.push("",...contactLines(d,2));
  }

  // Template 7 — gaya pemasaran dengan harga & lokasi di bawah pembukaan.
  else{
    if(d.jenis) lines.push("✨ "+d.jenis);
    lines.push("🏡 PELUANG HARTANAH");
    if(d.points.length) lines.push("","KELEBIHAN","",...d.points.map(x=>"⭐ "+x));
    lines.push("","BUTIRAN HARTANAH","",...commonDetails(d,"🔸 "));
    if(d.lokasi) lines.push("","📍 Lokasi: "+d.lokasi);
    if(d.harga) lines.push("💰 Harga: RM"+d.harga);
    if(d.ansuran) lines.push("💵 Ansuran: RM"+d.ansuran);
    lines.push("",...contactLines(d,3));
  }

  $("output").textContent=lines.join("\n").trim();
}

function resetForm(){
  if(!confirm("Reset semua maklumat?")) return;
  document.querySelectorAll("input").forEach(i=>i.value="");
  points.innerHTML="";
  detailsPoints.innerHTML="";
  $("output").textContent="Hasil akan muncul di sini.";
  currentTemplate=0;
  $("templateBtn").textContent="🔄 TUKAR TEMPLATE";
  $("status").style.display="none";
}

async function copy(){
  const text=$("output").textContent;
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const area=document.createElement("textarea");
    area.value=text;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }
  $("status").style.display="block";
  setTimeout(()=>$("status").style.display="none",1800);
}

$("templateBtn").addEventListener("click",()=>{
  currentTemplate=(currentTemplate+1)%7;
  $("templateBtn").textContent="🔄 TEMPLATE "+(currentTemplate+1)+"/7";
  generate();
});

$("addBtn").addEventListener("click",()=>addPoint());
$("addDetailBtn").addEventListener("click",()=>addDetailPoint());
$("generateBtn").addEventListener("click",generate);
$("resetBtn").addEventListener("click",resetForm);
$("copyBtn").addEventListener("click",copy);

$("shareBtn").addEventListener("click",async()=>{
  const text=$("output").textContent.trim();
  if(!text) return;
  if(navigator.share){
    try{
      await navigator.share({text:text});
    }catch(e){}
  }else{
    try{
      await navigator.clipboard.writeText(text);
      $("status").textContent="✓ Ayat disalin — boleh paste ke platform pilihan";
      $("status").style.display="block";
      setTimeout(()=>{
        $("status").textContent="✓ Ayat berjaya disalin";
        $("status").style.display="none";
      },2500);
    }catch(e){}
  }
});

document.querySelectorAll("#bilik,#air").forEach(i=>{
  i.addEventListener("input",()=>{
    i.value=i.value.replace(/\\D/g,"");
  });
});

document.querySelectorAll("#lebar,#panjan").forEach(i=>{
  i.addEventListener("input",()=>{
    i.value=i.value.replace(/[^0-9.]/g,"");
    const parts=i.value.split(".");
    if(parts.length>2) i.value=parts[0]+"."+parts.slice(1).join("");
  });
});

document.querySelectorAll("#harga,#ansuran").forEach(function(i){
  i.addEventListener("input", function(){
    formatNumberInput(this);
  });
});

document.querySelectorAll("input").forEach(i=>{
  i.addEventListener("keydown",e=>{if(e.key==="Enter") generate()});
});
})();
</script>
</body>
</html>
