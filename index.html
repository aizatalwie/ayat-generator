<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Property Caption Generator</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:#f2f3f5;color:#111}
main{max-width:720px;margin:auto;padding:16px;padding-bottom:40px}
h1{font-size:25px;margin:4px 0 16px}.card{background:white;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
h2{font-size:18px;margin:0 0 10px}
label{display:block;font-size:14px;font-weight:700;margin:12px 0 6px}
input{width:100%;font-size:16px;padding:12px;border:1px solid #d7d7d7;border-radius:10px;background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.point{display:flex;gap:7px;margin:8px 0}.point input{min-width:0}.remove{width:44px;background:#eee;border:0;border-radius:10px;font-size:20px}
#detailsPoints{margin-top:14px}
#addDetailBtn{margin-top:4px;margin-bottom:14px}
button{border:0;border-radius:11px;padding:12px 15px;font-size:16px;font-weight:700}
.add{background:#eee}.generate{width:100%;background:#111;color:#fff;margin-top:14px}.reset{width:100%;background:#f3d7d7;color:#9b1c1c;margin-top:10px}.copy{width:100%;background:#e9e9eb;margin-top:10px}
.output{min-height:100px;background:#fafafa;border:1px solid #ddd;border-radius:12px;padding:15px;white-space:pre-wrap;line-height:1.55;font-size:16px}
.ok{color:#167c35;font-size:13px;margin:8px 0 0;display:none}
</style>
</head>
<body>
<main>
<h1>📝 Property Caption Generator</h1>

<section class="card">
<h2>Maklumat Utama</h2>
<label>Jenis Rumah</label><input id="jenis" placeholder="Contoh: Single Storey Semi-D">
<label>Lokasi</label><input id="lokasi" placeholder="Contoh: Bertam, Melaka">
<div class="row">
<div><label>Harga (RM)</label><input id="harga" inputmode="numeric" placeholder="397000"></div>
<div><label>Ansuran (RM)</label><input id="ansuran" inputmode="numeric" placeholder="1400"></div>
</div>
</section>

<section class="card">
<h2>Maklumat Hartanah</h2>
<label>Pegangan</label><input id="pegangan" placeholder="Freehold">
<label>Title</label><input id="title" placeholder="MCL">
<div class="row">
<div><label>Lebar</label><input id="lebar" inputmode="decimal" placeholder="35"></div>
<div><label>Panjang</label><input id="panjan" inputmode="decimal" placeholder="75"></div>
</div>
<label>Built-up Area</label><input id="builtup" placeholder="Contoh: 2500sqft">
<div class="row">
<div><label>Bilik Tidur</label><input id="bilik" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="4"></div>
<div><label>Bilik Air</label><input id="air" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="2"></div>
</div>
<div id="detailsPoints"></div>
<button class="add" type="button" id="addDetailBtn">+ Tambah Point</button>
<label>Jangka Siap</label><input id="siap" placeholder="Q1 2027">
</section>

<section class="card">
<h2>Kelebihan Lokasi</h2>
<div id="points"></div>
<button class="add" type="button" id="addBtn">+ Tambah Point</button>
</section>

<section class="card">
<h2>Hubungi Untuk Maklumat Lanjut</h2>
<label>Nama</label><input id="contactName" placeholder="Nama">
<label>Nombor Telefon</label><input id="contactPhone" type="tel" inputmode="tel" placeholder="01x-xxxxxxx">
<label>Remark Whatsapp</label><input id="contactRemark" placeholder="Contoh: Rumah Semi D Seremban">
<button class="generate" type="button" id="generateBtn">GENERATE</button>
<button class="reset" type="button" id="resetBtn">↻ RESET</button>
</section>

<section class="card">
<h2>Hasil Ayat</h2>
<div id="output" class="output">Hasil akan muncul di sini.</div>
<button class="copy" type="button" id="copyBtn">📋 COPY AYAT</button>
<div id="status" class="ok">✓ Ayat berjaya disalin</div>
</section>
</main>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const points=$("points");
const detailsPoints=$("detailsPoints");

function addDetailPoint(value=""){
  const row=document.createElement("div");
  row.className="point";
  const input=document.createElement("input");
  input.className="detailPointInput";
  input.placeholder="Contoh: Carporch Luas";
  input.value=value;
  const remove=document.createElement("button");
  remove.type="button";
  remove.className="remove";
  remove.textContent="×";
  remove.addEventListener("click",()=>row.remove());
  row.appendChild(input);
  row.appendChild(remove);
  detailsPoints.appendChild(row);
}

function addPoint(value=""){
  const row=document.createElement("div");
  row.className="point";
  const input=document.createElement("input");
  input.className="pointInput";
  input.placeholder="Contoh: 10 minit ke Lotus Cheng";
  input.value=value;
  const remove=document.createElement("button");
  remove.type="button";
  remove.className="remove";
  remove.textContent="×";
  remove.addEventListener("click",()=>row.remove());
  row.appendChild(input);
  row.appendChild(remove);
  points.appendChild(row);
}

function val(id){return $(id).value.trim()}

function formatNumberInput(input){
  var digits = input.value.replace(/\D/g, "");
  if (digits.length === 0) {
    input.value = "";
    return;
  }

  var formatted = "";
  for (var i = 0; i < digits.length; i++) {
    if (i > 0 && (digits.length - i) % 3 === 0) {
      formatted += ",";
    }
    formatted += digits[i];
  }
  input.value = formatted;
}

function generate(){
  const p=[...document.querySelectorAll(".pointInput")].map(x=>x.value.trim()).filter(Boolean);
  const dp=[...document.querySelectorAll(".detailPointInput")].map(x=>x.value.trim()).filter(Boolean);
  const lines=[];
  if(val("jenis")) lines.push("🏡 "+val("jenis"));
  if(val("lokasi")) lines.push("📍 "+val("lokasi"));
  lines.push("");
  if(val("harga")) lines.push("💰 Harga bermula dari RM"+val("harga"));
  if(val("ansuran")) lines.push("💵 Anggaran bulanan serendah RM"+val("ansuran"));
  lines.push("");
  lines.push("MAKLUMAT HARTANAH");
  lines.push("");
  if(val("pegangan")) lines.push("✅ Pegangan: "+val("pegangan"));
  if(val("title")) lines.push("✅ Title: "+val("title"));
  if(val("lebar") || val("panjan")) {
    const lebar = val("lebar");
    const panjan = val("panjan");
    if (lebar && panjan) lines.push("✅ Saiz: "+lebar+"’ x "+panjan+"’");
    else if (lebar) lines.push("✅ Saiz: "+lebar+"’");
    else if (panjan) lines.push("✅ Saiz: "+panjan+"’");
  }
  if(val("builtup")) lines.push("✅ Built-up Area: "+val("builtup"));
  if(val("bilik") || val("air")) lines.push("✅ "+(val("bilik")||"—")+" bilik tidur, "+(val("air")||"—")+" bilik air");
  if(val("siap")) lines.push("✅ Jangka siap: "+val("siap"));
  dp.forEach(x=>lines.splice(lines.length-1,0,"✅ "+x));
  if(p.length){
    lines.push("");
    lines.push("KELEBIHAN LOKASI");
    lines.push("");
    p.forEach(x=>lines.push("📌 "+x));
  }

  if(val("contactName") || val("contactPhone")){
    lines.push("");
    lines.push("HUBUNGI UNTUK MAKLUMAT LANJUT");
    lines.push("");
    if(val("contactName")) lines.push("👤 "+val("contactName"));
    if(val("contactPhone")) {
      lines.push("📞 "+val("contactPhone"));
      const waNumber = val("contactPhone").replace(/\D/g,"").replace(/^0/,"60");
      const waRemark = val("contactRemark");
      if(waNumber) {
        const waUrl = "https://wa.me/"+waNumber+(waRemark ? "/"+encodeURIComponent(waRemark).replace(/%20/g,"+") : "");
        lines.push("💬 "+waUrl);
      }
    }
  }

  $("output").textContent=lines.join("\n").trim();
}

function resetForm(){
  if(!confirm("Reset semua maklumat?")) return;
  document.querySelectorAll("input").forEach(i=>i.value="");
  points.innerHTML="";
  detailsPoints.innerHTML="";
  $("output").textContent="Hasil akan muncul di sini.";
  $("status").style.display="none";
}

async function copy(){
  const text=$("output").textContent;
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const area=document.createElement("textarea");
    area.value=text;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }
  $("status").style.display="block";
  setTimeout(()=>$("status").style.display="none",1800);
}

$("addBtn").addEventListener("click",()=>addPoint());
$("addDetailBtn").addEventListener("click",()=>addDetailPoint());
$("generateBtn").addEventListener("click",generate);
$("resetBtn").addEventListener("click",resetForm);
$("copyBtn").addEventListener("click",copy);

document.querySelectorAll("#bilik,#air").forEach(i=>{
  i.addEventListener("input",()=>{
    i.value=i.value.replace(/\\D/g,"");
  });
});

document.querySelectorAll("#lebar,#panjan").forEach(i=>{
  i.addEventListener("input",()=>{
    i.value=i.value.replace(/[^0-9.]/g,"");
    const parts=i.value.split(".");
    if(parts.length>2) i.value=parts[0]+"."+parts.slice(1).join("");
  });
});

document.querySelectorAll("#harga,#ansuran").forEach(function(i){
  i.addEventListener("input", function(){
    formatNumberInput(this);
  });
});

document.querySelectorAll("input").forEach(i=>{
  i.addEventListener("keydown",e=>{if(e.key==="Enter") generate()});
});
})();
</script>
</body>
</html>
