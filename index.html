<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ayat Generator</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:#f2f3f5;color:#111}
main{max-width:720px;margin:auto;padding:16px;padding-bottom:40px}
h1{font-size:25px;margin:4px 0 16px}.card{background:white;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
h2{font-size:18px;margin:0 0 10px}
label{display:block;font-size:14px;font-weight:700;margin:12px 0 6px}
input{width:100%;font-size:16px;padding:12px;border:1px solid #d7d7d7;border-radius:10px;background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.point{display:flex;gap:7px;margin:8px 0}.point input{min-width:0}.remove{width:44px;background:#eee;border:0;border-radius:10px;font-size:20px}
button{border:0;border-radius:11px;padding:12px 15px;font-size:16px;font-weight:700}
.add{background:#eee}.generate{width:100%;background:#111;color:#fff;margin-top:14px}.reset{width:100%;background:#f3d7d7;color:#9b1c1c;margin-top:10px}.copy{width:100%;background:#e9e9eb;margin-top:10px}
.output{min-height:100px;background:#fafafa;border:1px solid #ddd;border-radius:12px;padding:15px;white-space:pre-wrap;line-height:1.55;font-size:16px}
.ok{color:#167c35;font-size:13px;margin:8px 0 0;display:none}
</style>
</head>
<body>
<main>
<h1>📝 Ayat Generator</h1>

<section class="card">
<h2>Maklumat Utama</h2>
<label>Jenis Rumah</label><input id="jenis" placeholder="Contoh: Single Storey Semi-D">
<label>Lokasi</label><input id="lokasi" placeholder="Contoh: Bertam, Melaka">
<div class="row">
<div><label>Harga (RM)</label><input id="harga" inputmode="numeric" placeholder="397000"></div>
<div><label>Ansuran (RM)</label><input id="ansuran" inputmode="numeric" placeholder="1400"></div>
</div>
</section>

<section class="card">
<h2>Maklumat Hartanah</h2>
<label>Pegangan</label><input id="pegangan" placeholder="Freehold">
<label>Title</label><input id="title" placeholder="MCL">
<label>Saiz</label><input id="saiz" placeholder="35’ x 75’">
<div class="row">
<div><label>Bilik Tidur</label><input id="bilik" placeholder="4"></div>
<div><label>Bilik Air</label><input id="air" placeholder="2"></div>
</div>
<label>Jangka Siap</label><input id="siap" placeholder="Q1 2027">
</section>

<section class="card">
<h2>Kelebihan Lokasi</h2>
<div id="points"></div>
<button class="add" type="button" id="addBtn">+ Tambah Point</button>
<button class="generate" type="button" id="generateBtn">GENERATE</button>
<button class="reset" type="button" id="resetBtn">↻ RESET</button>
</section>

<section class="card">
<h2>Hasil Ayat</h2>
<div id="output" class="output">Hasil akan muncul di sini.</div>
<button class="copy" type="button" id="copyBtn">📋 COPY AYAT</button>
<div id="status" class="ok">✓ Ayat berjaya disalin</div>
</section>
</main>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const points=$("points");

function addPoint(value=""){
  const row=document.createElement("div");
  row.className="point";
  const input=document.createElement("input");
  input.className="pointInput";
  input.placeholder="Contoh: 10 minit ke Lotus Cheng";
  input.value=value;
  const remove=document.createElement("button");
  remove.type="button";
  remove.className="remove";
  remove.textContent="×";
  remove.addEventListener("click",()=>row.remove());
  row.appendChild(input);
  row.appendChild(remove);
  points.appendChild(row);
}

function val(id){return $(id).value.trim()}

function formatNumberInput(input){
  const digits=input.value.replace(/\\D/g,"");
  input.value=digits ? Number(digits).toLocaleString("en-US") : "";
}

["harga","ansuran"].forEach(id=>{
  $(id).addEventListener("input",()=>formatNumberInput($(id)));
});

function generate(){
  const p=[...document.querySelectorAll(".pointInput")].map(x=>x.value.trim()).filter(Boolean);
  const lines=[];
  if(val("jenis")) lines.push("🏡 "+val("jenis"));
  if(val("lokasi")) lines.push("📍 "+val("lokasi"));
  lines.push("");
  if(val("harga")) lines.push("💰 Harga bermula dari RM"+val("harga"));
  if(val("ansuran")) lines.push("💵 Anggaran bulanan serendah RM"+val("ansuran"));
  lines.push("");
  lines.push("MAKLUMAT HARTANAH");
  lines.push("");
  if(val("pegangan")) lines.push("✅ Pegangan: "+val("pegangan"));
  if(val("title")) lines.push("✅ Title: "+val("title"));
  if(val("saiz")) lines.push("✅ Saiz: "+val("saiz"));
  if(val("bilik") || val("air")) lines.push("✅ "+(val("bilik")||"—")+" bilik tidur, "+(val("air")||"—")+" bilik air");
  if(val("siap")) lines.push("✅ Jangka siap: "+val("siap"));
  if(p.length){
    lines.push("");
    lines.push("KELEBIHAN LOKASI");
    lines.push("");
    p.forEach(x=>lines.push("📌 "+x));
  }
  $("output").textContent=lines.join("\n").trim();
}

function resetForm(){
  if(!confirm("Reset semua maklumat?")) return;
  document.querySelectorAll("input").forEach(i=>i.value="");
  points.innerHTML="";
  $("output").textContent="Hasil akan muncul di sini.";
  $("status").style.display="none";
}

async function copy(){
  const text=$("output").textContent;
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const area=document.createElement("textarea");
    area.value=text;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }
  $("status").style.display="block";
  setTimeout(()=>$("status").style.display="none",1800);
}

$("addBtn").addEventListener("click",()=>addPoint());
$("generateBtn").addEventListener("click",generate);
$("resetBtn").addEventListener("click",resetForm);
$("copyBtn").addEventListener("click",copy);

document.querySelectorAll("input").forEach(i=>{
  i.addEventListener("keydown",e=>{if(e.key==="Enter") generate()});
});
})();
</script>
</body>
</html>
